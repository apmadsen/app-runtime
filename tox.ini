[tox]
isolated_build = true
env_list =
    py310
    py311
    py312
    py313
    py314
minversion = 4.4.6

[testenv]
deps =
    pytest
    platformdirs >= 4.3, < 4.4
skip_install = true
setenv = file|.env
passenv =
    DISPLAY
    WAYLAND_DISPLAY
    DBUS_SESSION_BUS_ADDRESS
    USERNAME
commands = python -m pytest
